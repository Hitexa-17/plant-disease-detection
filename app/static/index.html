<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plant Disease AI</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="background"></div>

<div class="container">

    <header>
        <div class="logo">🌿</div>
        <div>
            <h1>Plant Disease AI</h1>
            <p>Deep Learning based plant disease detection</p>
        </div>
    </header>

    <main>

        <div class="upload-card">

            <div class="upload-area" id="uploadArea">

                <div class="upload-icon">📷</div>

                <h2>Upload Plant Image</h2>

                <p>
                    Upload a clear image of a plant leaf
                </p>

                <label for="imageInput" class="upload-btn">
                    Choose Image
                </label>

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                    hidden
                >

                <p class="file-name" id="fileName">
                    No image selected
                </p>

            </div>

            <div class="preview-container">

                <img
                    id="preview"
                    alt="Plant preview"
                >

            </div>

            <button
                id="predictBtn"
                onclick="predictDisease()"
                disabled
            >
                🔍 Analyze Plant
            </button>

            <div id="loading"></div>

        </div>


        <div class="result-card" id="result">

            <div class="result-header">
                <span>🤖 AI Analysis</span>
            </div>

            <div class="main-result">

                <div class="disease-icon">
                    🌱
                </div>

                <div>
                    <p class="label">
                        Detected Disease
                    </p>

                    <h2 id="disease">
                        -
                    </h2>
                </div>

            </div>


            <div class="confidence-section">

                <div class="confidence-top">
                    <span>Confidence</span>
                    <strong id="confidence">
                        0%
                    </strong>
                </div>

                <div class="progress">
                    <div
                        id="confidenceBar"
                        class="progress-bar">
                    </div>
                </div>

            </div>


            <div class="top3">

                <h3>Top 3 Predictions</h3>

                <div id="predictionList"></div>

            </div>


            <div id="warning"></div>

        </div>

    </main>

    <footer>
        <span>Powered by EfficientNet-B0</span>
        <span>•</span>
        <span>Deep Learning</span>
    </footer>

</div>

<script src="/static/script.js"></script>

</body>
</html>
